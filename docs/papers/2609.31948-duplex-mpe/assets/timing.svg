<svg class="rd-svg" viewBox="0 0 680 430" role="img" aria-labelledby="tm-t tm-d" xmlns="http://www.w3.org/2000/svg">
<title id="tm-t">The two timing rules</title>
<desc id="tm-d">Top: after the T request ends, a response counts as a fresh onset only if the assistant was silent at the boundary and starts within 5 seconds; speech already running counts only for response presence. Bottom: for N4, the assistant should start answering in the 3 second gap after the question, and must be silent 2 seconds after the human resolution begins and stay silent until the resolution clip ends plus half a second.</desc>
<text x="20" y="28" font-size="18" font-weight="600">1 · After T: fresh onset or continuation?</text>
<rect x="30" y="46" width="200" height="34" rx="5" class="f-predict soft s-predict"/><text x="130" y="69" text-anchor="middle" font-size="16" font-weight="600">T (human)</text>
<rect x="230" y="40" width="250" height="146" class="f-paper softer"/>
<text x="355" y="60" text-anchor="middle" font-size="15" class="t-muted">5 s to start</text>
<line x1="230" y1="40" x2="230" y2="190" class="s-ink" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="224" y="206" text-anchor="end" font-size="15">T ends</text>
<text x="30" y="118" font-size="15">case A</text>
<rect x="280" y="100" width="220" height="28" rx="5" class="f-code s-code" fill-opacity="0.55"/>
<text x="520" y="120" font-size="15" class="t-code">fresh onset ✓</text>
<text x="30" y="170" font-size="15">case B</text>
<rect x="110" y="152" width="300" height="28" rx="5" class="f-code s-code" fill-opacity="0.55"/>
<text x="420" y="172" font-size="15" class="t-predict">presence only ✗</text>
<text x="20" y="250" font-size="18" font-weight="600">2 · N4: answer in the gap, then stop</text>
<rect x="30" y="268" width="130" height="34" rx="5" class="f-predict soft s-predict"/><text x="95" y="291" text-anchor="middle" font-size="16" font-weight="600">N4_Q</text>
<rect x="160" y="262" width="150" height="100" class="f-paper softer"/><text x="235" y="282" text-anchor="middle" font-size="15" class="t-muted">3 s gap</text>
<rect x="310" y="268" width="220" height="34" rx="5" class="f-take soft s-take"/><text x="358" y="291" text-anchor="middle" font-size="16" font-weight="600">N4_R</text><text x="472" y="291" text-anchor="middle" font-size="15">“never mind”</text>
<rect x="190" y="322" width="190" height="28" rx="5" class="f-code s-code" fill-opacity="0.55"/>
<text x="20" y="342" font-size="15">Aria</text>
<line x1="410" y1="258" x2="410" y2="372" class="s-predict" stroke-width="2" stroke-dasharray="4 3"/>
<text x="410" y="392" text-anchor="middle" font-size="15" class="t-predict">R start + 2 s</text>
<line x1="560" y1="258" x2="560" y2="372" class="s-muted" stroke-width="1.5" stroke-dasharray="2 3"/>
<text x="560" y="392" text-anchor="middle" font-size="15" class="t-muted">R end + 0.5 s</text>
<rect x="410" y="318" width="150" height="36" class="f-predict softer"/>
<text x="485" y="341" text-anchor="middle" font-size="15" class="t-predict">must be silent</text>
<text x="340" y="420" text-anchor="middle" font-size="15" class="t-muted">Scored only if silent during Q, onset in the gap, and still talking when R starts.</text>
</svg>
