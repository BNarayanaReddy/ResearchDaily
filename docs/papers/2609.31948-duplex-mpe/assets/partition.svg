<svg class="rd-svg" viewBox="0 0 680 370" role="img" aria-labelledby="pt-t pt-d" xmlns="http://www.w3.org/2000/svg">
<title id="pt-t">What happened after each of the 2,000 explicit T requests</title>
<desc id="pt-d">Stacked bars per model splitting the 2,000 explicit T requests into fresh onsets, speech already running when T ended, and misses. MiniCPM-o is almost all fresh onsets; Freeze-Omni is mostly already speaking; Voila misses about a third. Numbers from Table 9.</desc>
