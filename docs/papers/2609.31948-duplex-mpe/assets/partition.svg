<rect x="320" y="14" width="18" height="18" rx="3" class="f-predict" fill-opacity="0.7"/><text x="344" y="29" font-size="16">already speaking</text>
<rect x="480" y="14" width="18" height="18" rx="3" class="f-faint" fill-opacity="0.7"/><text x="504" y="29" font-size="16">miss (silent)</text>
