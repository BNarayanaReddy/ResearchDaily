<svg class="rd-svg" viewBox="0 0 680 220" role="img" aria-labelledby="rm-t rm-d" xmlns="http://www.w3.org/2000/svg">
<title id="rm-t">Same program, new clothes</title>
<desc id="rm-d">One program, many seeded views. If it drops while the tests are unchanged, part of the score came from familiar cues. The cost shows up first as extra exploration.</desc>
<defs><marker id="rm-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-muted"/></marker></defs>
<rect x="20" y="70" width="150" height="70" rx="10" class="f-paper soft s-paper" stroke-width="1.5"/>
<text x="95" y="102" text-anchor="middle" font-size="18" font-weight="600">1 program</text>
<text x="95" y="126" text-anchor="middle" font-size="15" class="t-muted">same tests</text>
<line x1="170" y1="105" x2="240" y2="50" class="s-muted" stroke-width="1.5" marker-end="url(#rm-a)"/>
<line x1="170" y1="105" x2="240" y2="105" class="s-muted" stroke-width="1.5" marker-end="url(#rm-a)"/>
<line x1="170" y1="105" x2="240" y2="160" class="s-muted" stroke-width="1.5" marker-end="url(#rm-a)"/>
<g font-size="16"><rect x="244" y="30" width="130" height="38" rx="7" class="f-take soft s-take"/><text x="309" y="55" text-anchor="middle">view seed 0</text>
<rect x="244" y="86" width="130" height="38" rx="7" class="f-take soft s-take"/><text x="309" y="111" text-anchor="middle">view seed 1</text>
<rect x="244" y="142" width="130" height="38" rx="7" class="f-take soft s-take"/><text x="309" y="167" text-anchor="middle">view seed 2</text></g>
<line x1="374" y1="105" x2="420" y2="105" class="s-muted" stroke-width="1.5" marker-end="url(#rm-a)"/>
<rect x="424" y="30" width="236" height="150" rx="10" class="f-predict softer s-predict" stroke-width="1.5"/>
<text x="542" y="62" text-anchor="middle" font-size="17" font-weight="600">score drop</text>
<text x="542" y="86" text-anchor="middle" font-size="16">= leaning on familiar cues</text>
<text x="542" y="122" text-anchor="middle" font-size="17" font-weight="600">extra actions</text>
<text x="542" y="146" text-anchor="middle" font-size="16">= mostly exploration</text>
<text x="542" y="206" text-anchor="middle" font-size="15" class="t-muted">names (Level 2) carry most of it</text>
</svg>
