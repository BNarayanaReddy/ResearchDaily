<svg class="rd-svg" viewBox="0 0 680 470" role="img" aria-labelledby="op-t op-d" xmlns="http://www.w3.org/2000/svg">
<title id="op-t">SchrodingerRepo in one picture</title>
<desc id="op-d">A canonical SWE-bench repository passes through a seed-controlled set of four lenses (reworded issue, renamed namespace, reordered definitions, rewritten code) to produce a fresh view for the agent. The agent's commands are translated back to the real repository, and its final patch is diffed against the original repository and graded by the original tests.</desc>
<defs><marker id="op-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-muted"/></marker></defs>
<rect x="16" y="20" width="190" height="150" rx="10" class="f-paper soft s-paper" stroke-width="1.5"/>
<text x="111" y="50" text-anchor="middle" font-size="19" font-weight="600">Canonical repo</text>
<text x="111" y="80" text-anchor="middle" font-size="16" class="mono">django/db/models/</text>
<text x="111" y="104" text-anchor="middle" font-size="16" class="mono">get_%s_display</text>
<text x="111" y="128" text-anchor="middle" font-size="16" class="t-muted">seen in training</text>
<text x="111" y="152" text-anchor="middle" font-size="16" class="t-muted">many times</text>
<line x1="206" y1="95" x2="252" y2="95" class="s-muted" stroke-width="1.5" marker-end="url(#op-a)"/>
<rect x="256" y="12" width="176" height="300" rx="10" class="f-predict softer s-predict" stroke-width="1.5"/>
<text x="344" y="40" text-anchor="middle" font-size="18" font-weight="600" class="t-predict">seed → 4 lenses</text>
<rect x="270" y="56" width="148" height="52" rx="7" class="f-surface s-faint"/>
<text x="344" y="80" text-anchor="middle" font-size="17">L1 reword</text><text x="344" y="100" text-anchor="middle" font-size="15" class="t-muted">the issue</text>
<rect x="270" y="118" width="148" height="52" rx="7" class="f-predict soft s-predict" stroke-width="2"/>
<text x="344" y="142" text-anchor="middle" font-size="17" font-weight="600">L2 rename</text><text x="344" y="162" text-anchor="middle" font-size="15" class="t-muted">paths + symbols</text>
<rect x="270" y="180" width="148" height="52" rx="7" class="f-surface s-faint"/>
<text x="344" y="204" text-anchor="middle" font-size="17">L3 reorder</text><text x="344" y="224" text-anchor="middle" font-size="15" class="t-muted">defs in a file</text>
<rect x="270" y="242" width="148" height="52" rx="7" class="f-surface s-faint"/>
<text x="344" y="266" text-anchor="middle" font-size="17">L4 rewrite</text><text x="344" y="286" text-anchor="middle" font-size="15" class="t-muted">code near fix</text>
<line x1="432" y1="95" x2="472" y2="95" class="s-muted" stroke-width="1.5" marker-end="url(#op-a)"/>
<rect x="476" y="20" width="190" height="150" rx="10" class="f-take soft s-take" stroke-width="1.5"/>
<text x="571" y="50" text-anchor="middle" font-size="19" font-weight="600">Agent's view</text>
<text x="571" y="80" text-anchor="middle" font-size="15" class="mono">storage_engine/</text>
<text x="571" y="102" text-anchor="middle" font-size="15" class="mono">object_models/</text>
<text x="571" y="126" text-anchor="middle" font-size="16" class="mono">render_%s_label</text>
<text x="571" y="152" text-anchor="middle" font-size="16" class="t-muted">never seen before</text>
<line x1="571" y1="170" x2="571" y2="226" class="s-muted" stroke-width="1.5" marker-end="url(#op-a)"/>
<text x="580" y="204" font-size="15" class="t-muted">bash actions</text>
<rect x="476" y="230" width="190" height="82" rx="10" class="f-code soft s-code" stroke-width="1.5"/>
<text x="571" y="258" text-anchor="middle" font-size="17" font-weight="600">Translator</text>
<text x="571" y="282" text-anchor="middle" font-size="15">virtual ⇄ real names</text>
<text x="571" y="302" text-anchor="middle" font-size="15" class="t-muted">(invertible, seeded)</text>
<line x1="571" y1="312" x2="571" y2="360" class="s-muted" stroke-width="1.5" marker-end="url(#op-a)"/>
<rect x="16" y="364" width="650" height="90" rx="10" class="f-paper softer s-paper" stroke-width="1.5"/>
<text x="341" y="394" text-anchor="middle" font-size="18" font-weight="600">Real Docker environment, real tests</text>
<text x="341" y="420" text-anchor="middle" font-size="16">final patch = diff(original files, final files)</text>
<text x="341" y="442" text-anchor="middle" font-size="16" class="t-muted">graded exactly like normal SWE-bench</text>
<line x1="111" y1="170" x2="111" y2="360" class="s-muted" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#op-a)"/>
<text x="120" y="270" font-size="15" class="t-muted">same code runs</text>
</svg>
