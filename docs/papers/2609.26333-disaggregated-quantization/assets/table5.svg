<svg class="rd-svg" viewBox="0 0 680 420" role="img" aria-labelledby="t5-t t5-d" xmlns="http://www.w3.org/2000/svg">
<title id="t5-t">Prefillers on released Qwen3.8-27B GGUF decoders, MMLU-Pro</title>
<desc id="t5-d">Paired bars for eight GGUF decode formats from 1 to 3 bits. Weight-only accuracy on MMLU-Pro rises from 29.0 at IQ1_S to 84.3 at Q3_K_XL. Adding a trained NVFP4 prefiller lifts IQ1_S to 61.5, IQ1_M from 52.9 to 72.6 and IQ2_XXS from 70.5 to 77.9; from Q2_K_XL upward the change is under one point, and at IQ3_S and Q3_K_XL it is slightly negative. BF16 reference is 84.6.</desc>
