<svg class="rd-svg" viewBox="0 0 680 200" role="img" aria-labelledby="rm-t rm-d" xmlns="http://www.w3.org/2000/svg">
<title id="rm-t">Read fast, write small</title>
<desc id="rm-d">Compact summary: the reader is 4-bit compute on SSD, the writer is 2-bit weights on the GPU, and they meet at the KV cache; training on the answer ties them together.</desc>
<defs><marker id="rm-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-muted"/></marker></defs>
<rect x="16" y="30" width="210" height="110" rx="10" class="f-predict soft s-predict" stroke-width="1.5"/>
<text x="121" y="64" text-anchor="middle" font-size="20" font-weight="650" class="t-predict">READ fast</text>
<text x="121" y="92" text-anchor="middle" font-size="16">prefill · W4A4 NVFP4</text>
<text x="121" y="118" text-anchor="middle" font-size="16" class="t-muted">lives on SSD</text>
<rect x="262" y="52" width="156" height="66" rx="10" class="f-hl soft s-muted" stroke-width="1.5"/>
<text x="340" y="92" text-anchor="middle" font-size="19" font-weight="600">KV cache</text>
<rect x="454" y="30" width="210" height="110" rx="10" class="f-paper soft s-paper" stroke-width="1.5"/>
<text x="559" y="64" text-anchor="middle" font-size="20" font-weight="650" class="t-paper">WRITE small</text>
<text x="559" y="92" text-anchor="middle" font-size="16">decode · 2-bit weight-only</text>
<text x="559" y="118" text-anchor="middle" font-size="16" class="t-muted">lives on GPU</text>
<line x1="226" y1="85" x2="258" y2="85" class="s-muted" stroke-width="1.8" marker-end="url(#rm-a)"/>
<line x1="418" y1="85" x2="450" y2="85" class="s-muted" stroke-width="1.8" marker-end="url(#rm-a)"/>
<text x="340" y="180" text-anchor="middle" font-size="17" class="t-take">trained together on the answer (QADD)</text>
</svg>
