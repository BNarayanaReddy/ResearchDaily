<circle cx="630.0" cy="183" r="6.5" class="f-take"/>
<text x="20" y="254" font-size="18" font-weight="600" class="t-predict">LUT2, 2 bits</text>
<text x="660" y="254" text-anchor="end" font-size="16" class="t-muted">4 values, asymmetric</text>
<line x1="70.0" y1="288" x2="630.0" y2="288" class="s-faint" stroke-width="1.5"/>
<line x1="70.0" y1="294" x2="70.0" y2="300" class="s-muted" stroke-width="1"/>
<text x="70.0" y="320" text-anchor="middle" font-size="16" class="t-muted">-6</text>
<line x1="210.0" y1="294" x2="210.0" y2="300" class="s-muted" stroke-width="1"/>
<text x="210.0" y="320" text-anchor="middle" font-size="16" class="t-muted">-3</text>
<line x1="350.0" y1="294" x2="350.0" y2="300" class="s-muted" stroke-width="1"/>
<text x="350.0" y="320" text-anchor="middle" font-size="16" class="t-muted">0</text>
<line x1="490.0" y1="294" x2="490.0" y2="300" class="s-muted" stroke-width="1"/>
<text x="490.0" y="320" text-anchor="middle" font-size="16" class="t-muted">+3</text>
<line x1="630.0" y1="294" x2="630.0" y2="300" class="s-muted" stroke-width="1"/>
<text x="630.0" y="320" text-anchor="middle" font-size="16" class="t-muted">+6</text>
<circle cx="179.6" cy="288" r="6.5" class="f-predict"/>
<circle cx="350.0" cy="288" r="6.5" class="f-predict"/>
<circle cx="467.7" cy="288" r="6.5" class="f-predict"/>
<circle cx="630.0" cy="288" r="6.5" class="f-predict"/>
<text x="630.0" y="272" text-anchor="middle" font-size="15" class="t-predict">block max</text>
