<svg class="rd-svg" viewBox="0 0 640 310" role="img" aria-labelledby="bp-t bp-d" xmlns="http://www.w3.org/2000/svg">
<title id="bp-t">BPP: more tasks with fewer demos each lowers drawing error</title>
<desc id="bp-d">Bar chart at a fixed budget of 10,000 drawing demonstrations. 500 tasks with 20 demos each gives 9.5 pixels mean Chamfer error, 1,000 tasks with 10 each gives 5.1, and 2,000 tasks with 5 each gives 3.4.</desc>
<line x1="80" y1="230" x2="620" y2="230" class="s-muted" stroke-width="1.2"/>
<line x1="80" y1="130" x2="620" y2="130" class="s-faint" stroke-width="0.8"/>
<line x1="80" y1="30" x2="620" y2="30" class="s-faint" stroke-width="0.8"/>
<text x="72" y="236" text-anchor="end" font-size="17" class="t-muted">0</text>
<text x="72" y="136" text-anchor="end" font-size="17" class="t-muted">5</text>
<text x="72" y="36" text-anchor="end" font-size="17" class="t-muted">10</text>
<text x="26" y="130" text-anchor="middle" font-size="17" transform="rotate(-90 26 130)">error (px) ↓</text>
<rect x="115" y="40" width="110" height="190" rx="4" class="f-paper"/>
<rect x="295" y="128" width="110" height="102" rx="4" class="f-paper"/>
<rect x="475" y="162" width="110" height="68" rx="4" class="f-paper"/>
<text x="170" y="34" text-anchor="middle" font-size="19" font-weight="700">9.5</text>
<text x="350" y="120" text-anchor="middle" font-size="19" font-weight="700">5.1</text>
<text x="530" y="154" text-anchor="middle" font-size="19" font-weight="700">3.4</text>
<text x="170" y="258" text-anchor="middle" font-size="18">500 × 20</text>
<text x="350" y="258" text-anchor="middle" font-size="18">1,000 × 10</text>
<text x="530" y="258" text-anchor="middle" font-size="18">2,000 × 5</text>
<text x="350" y="294" text-anchor="middle" font-size="18" class="t-muted">tasks × demos per task (10,000 demos total)</text>
</svg>
