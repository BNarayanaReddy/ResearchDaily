<svg class="rd-svg" viewBox="0 0 640 590" role="img" aria-labelledby="sh-t sh-d" xmlns="http://www.w3.org/2000/svg">
<title id="sh-t">Data flow of a context-conditioned policy with shapes</title>
<desc id="sh-d">A demonstration of L elements is encoded to L by d features. The robot history becomes a d-dimensional query. A score and softmax give L attention weights, which read a d-dimensional representation r_t. An action generator turns r_t and the history into an action block of H steps by 7 numbers.</desc>
<defs><marker id="sh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-muted"/></marker></defs>
<rect x="20" y="14" width="280" height="62" rx="10" class="f-predict soft s-predict" stroke-width="1.5"/>
<text x="160" y="42" text-anchor="middle" font-size="19">Demo Dˢ = (d₁ … d<tspan baseline-shift="sub" font-size="14">L</tspan>)</text>
<text x="160" y="66" text-anchor="middle" font-size="18" class="mono">L elements</text>
<rect x="340" y="14" width="280" height="62" rx="10" class="f-paper soft s-paper" stroke-width="1.5"/>
<text x="480" y="42" text-anchor="middle" font-size="19">History hₜ</text>
<text x="480" y="66" text-anchor="middle" font-size="18" class="mono">images, joints, …</text>
<line x1="160" y1="76" x2="160" y2="106" class="s-muted" stroke-width="1.5" marker-end="url(#sh-arrow)"/>
<line x1="480" y1="76" x2="480" y2="106" class="s-muted" stroke-width="1.5" marker-end="url(#sh-arrow)"/>
<rect x="20" y="110" width="280" height="62" rx="10" class="f-take soft s-take" stroke-width="1.5"/>
<text x="160" y="138" text-anchor="middle" font-size="19">encode e<tspan baseline-shift="sub" font-size="14">θ</tspan>(dᵢ)</text>
<text x="160" y="162" text-anchor="middle" font-size="18" class="mono">L × d</text>
<rect x="340" y="110" width="280" height="62" rx="10" class="f-take soft s-take" stroke-width="1.5"/>
<text x="480" y="138" text-anchor="middle" font-size="19">encode query</text>
<text x="480" y="162" text-anchor="middle" font-size="18" class="mono">d</text>
<line x1="160" y1="172" x2="290" y2="206" class="s-muted" stroke-width="1.5" marker-end="url(#sh-arrow)"/>
<line x1="480" y1="172" x2="350" y2="206" class="s-muted" stroke-width="1.5" marker-end="url(#sh-arrow)"/>
<rect x="120" y="210" width="400" height="62" rx="10" class="f-take soft s-take" stroke-width="1.5"/>
<text x="320" y="238" text-anchor="middle" font-size="19">score s<tspan baseline-shift="sub" font-size="14">θ</tspan>(hₜ, dᵢ) → softmax (Eq. 6)</text>
<text x="320" y="262" text-anchor="middle" font-size="18" class="mono">α: L weights, sum to 1</text>
<line x1="320" y1="272" x2="320" y2="302" class="s-muted" stroke-width="1.5" marker-end="url(#sh-arrow)"/>
<rect x="120" y="306" width="400" height="62" rx="10" class="f-take soft s-take" stroke-width="1.5"/>
<text x="320" y="334" text-anchor="middle" font-size="19">read rₜ = Σᵢ αᵢ e<tspan baseline-shift="sub" font-size="14">θ</tspan>(dᵢ)</text>
<text x="320" y="358" text-anchor="middle" font-size="18" class="mono">d</text>
<line x1="320" y1="368" x2="320" y2="398" class="s-muted" stroke-width="1.5" marker-end="url(#sh-arrow)"/>
<rect x="120" y="402" width="400" height="62" rx="10" class="f-take soft s-take" stroke-width="1.5"/>
<text x="320" y="430" text-anchor="middle" font-size="19">action generator q<tspan baseline-shift="super" font-size="14">a</tspan>(Aₜ | hₜ, rₜ)</text>
<text x="320" y="454" text-anchor="middle" font-size="18" class="t-muted">Eq. 4: token, diffusion or flow head</text>
<line x1="320" y1="464" x2="320" y2="494" class="s-muted" stroke-width="1.5" marker-end="url(#sh-arrow)"/>
<rect x="120" y="498" width="400" height="74" rx="10" class="f-surface s-ink" stroke-width="1.5"/>
<text x="320" y="528" text-anchor="middle" font-size="19">action block Aₜ</text>
<text x="320" y="556" text-anchor="middle" font-size="18" class="mono">H × 7  (6 pose + 1 gripper)</text>
</svg>
