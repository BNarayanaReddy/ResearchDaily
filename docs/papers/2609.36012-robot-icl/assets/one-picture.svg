<svg class="rd-svg" viewBox="0 0 640 610" role="img" aria-labelledby="op-t op-d" xmlns="http://www.w3.org/2000/svg">
<title id="op-t">The map of in-context learning for robots</title>
<desc id="op-d">Teaching evidence (a demonstration, a correction, or interaction) becomes context. With the network weights frozen, the context passes through one of four doors: Act produces an action distribution, Retarget produces a motion reference, Forecast produces a predicted future, Script produces a skill or program call. An executor and the robot body turn that intermediate into actions, and outcomes flow back into later context. Correspondence and memory support every door.</desc>
<defs><marker id="op-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-muted"/></marker></defs>
<rect x="20" y="14" width="180" height="54" rx="10" class="f-predict soft s-predict" stroke-width="1.5"/>
<text x="110" y="48" text-anchor="middle" font-size="19">Demonstration</text>
<rect x="220" y="14" width="180" height="54" rx="10" class="f-predict soft s-predict" stroke-width="1.5"/>
<text x="310" y="48" text-anchor="middle" font-size="19">Correction</text>
<rect x="420" y="14" width="180" height="54" rx="10" class="f-predict soft s-predict" stroke-width="1.5"/>
<text x="510" y="48" text-anchor="middle" font-size="19">Interaction</text>
<line x1="110" y1="68" x2="110" y2="102" class="s-muted" stroke-width="1.5" marker-end="url(#op-arrow)"/>
<line x1="310" y1="68" x2="310" y2="102" class="s-muted" stroke-width="1.5" marker-end="url(#op-arrow)"/>
<line x1="510" y1="68" x2="510" y2="102" class="s-muted" stroke-width="1.5" marker-end="url(#op-arrow)"/>
<rect x="20" y="106" width="580" height="58" rx="10" class="f-paper soft s-paper" stroke-width="1.5"/>
<text x="310" y="142" text-anchor="middle" font-size="20">Context Cₜ  +  robot history hₜ</text>
<rect x="20" y="182" width="280" height="44" rx="22" class="f-surface s-muted" stroke-width="1.2"/>
<text x="160" y="210" text-anchor="middle" font-size="18">Correspondence: bind it here</text>
<rect x="320" y="182" width="280" height="44" rx="22" class="f-surface s-muted" stroke-width="1.2"/>
<text x="460" y="210" text-anchor="middle" font-size="18">Memory: keep it until needed</text>
<rect x="12" y="240" width="596" height="226" rx="12" class="f-none s-take" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="596" y="262" text-anchor="end" font-size="18" class="t-take">neural weights θ frozen</text>
<rect x="20" y="272" width="280" height="88" rx="10" class="f-take soft s-take" stroke-width="1.5"/>
<text x="160" y="308" text-anchor="middle" font-size="23" font-weight="700">Act</text>
<text x="160" y="338" text-anchor="middle" font-size="18">→ action distribution</text>
<rect x="320" y="272" width="280" height="88" rx="10" class="f-take soft s-take" stroke-width="1.5"/>
<text x="460" y="308" text-anchor="middle" font-size="23" font-weight="700">Retarget</text>
<text x="460" y="338" text-anchor="middle" font-size="18">→ motion reference</text>
<rect x="20" y="370" width="280" height="88" rx="10" class="f-take soft s-take" stroke-width="1.5"/>
<text x="160" y="406" text-anchor="middle" font-size="23" font-weight="700">Forecast</text>
<text x="160" y="436" text-anchor="middle" font-size="18">→ predicted future</text>
<rect x="320" y="370" width="280" height="88" rx="10" class="f-take soft s-take" stroke-width="1.5"/>
<text x="460" y="406" text-anchor="middle" font-size="23" font-weight="700">Script</text>
<text x="460" y="436" text-anchor="middle" font-size="18">→ skill / program call</text>
<line x1="310" y1="466" x2="310" y2="496" class="s-muted" stroke-width="1.5" marker-end="url(#op-arrow)"/>
<rect x="20" y="500" width="580" height="56" rx="10" class="f-surface s-ink" stroke-width="1.5"/>
<text x="310" y="535" text-anchor="middle" font-size="20">Executor + robot body → actions Aₜ</text>
<path d="M600,528 L626,528 L626,135 L604,135" class="s-muted f-none" stroke-width="1.5" marker-end="url(#op-arrow)"/>
<text x="310" y="590" text-anchor="middle" font-size="18" class="t-muted">outcomes and corrections feed later context ↺</text>
</svg>
