<svg class="rd-svg" viewBox="0 0 640 380" role="img" aria-labelledby="se-t se-d" xmlns="http://www.w3.org/2000/svg">
<title id="se-t">Object-relative transfer worked in 2D</title>
<desc id="se-d">Left: in the demo the object sits at (0.40, 0.20) facing 0 degrees and the gripper waits 10 cm below it at (0.40, 0.10) facing up. Right: in the query scene the object has moved to (0.60, 0.50) and turned 90 degrees, so the transferred gripper pose is (0.70, 0.50) facing 180 degrees, still 10 cm along the object's minus-y axis and facing it.</desc>
<rect x="20" y="20" width="280" height="310" rx="10" class="f-surface s-muted" stroke-width="1.2"/>
<rect x="340" y="20" width="280" height="310" rx="10" class="f-surface s-muted" stroke-width="1.2"/>
<text x="160" y="50" text-anchor="middle" font-size="19" font-weight="700">Demo scene (s)</text>
<text x="480" y="50" text-anchor="middle" font-size="19" font-weight="700">Query scene (q)</text>
<g transform="translate(160,255) rotate(0)"><rect x="-18" y="-18" width="36" height="36" rx="4" class="f-paper soft s-paper" stroke-width="2"/><line x1="0" y1="0" x2="30" y2="0" class="s-paper" stroke-width="2.5"/></g>
<g transform="translate(160,287.5) rotate(-90)"><path d="M4,-10 L-10,-10 L-10,10 L4,10" class="s-take f-none" stroke-width="3.5"/></g>
<text x="160" y="214" text-anchor="middle" font-size="18" class="t-paper">object (0.40, 0.20, 0°)</text>
<text x="160" y="318" text-anchor="middle" font-size="18" class="t-take">gripper (0.40, 0.10, 90°)</text>
<g transform="translate(545,157.5) rotate(-90)"><rect x="-18" y="-18" width="36" height="36" rx="4" class="f-paper soft s-paper" stroke-width="2"/><line x1="0" y1="0" x2="30" y2="0" class="s-paper" stroke-width="2.5"/></g>
<g transform="translate(577.5,157.5) rotate(-180)"><path d="M4,-10 L-10,-10 L-10,10 L4,10" class="s-take f-none" stroke-width="3.5"/></g>
<text x="610" y="106" text-anchor="end" font-size="18" class="t-paper">object (0.60, 0.50, 90°)</text>
<text x="610" y="214" text-anchor="end" font-size="18" class="t-take">gripper → (0.70, 0.50, 180°)</text>
<text x="320" y="364" text-anchor="middle" font-size="18" class="t-muted">kept fixed: 10 cm along the object's −y axis, facing it</text>
</svg>
