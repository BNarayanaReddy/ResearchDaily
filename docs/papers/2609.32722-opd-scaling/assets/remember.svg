<svg class="rd-svg" viewBox="0 0 680 300" role="img" aria-labelledby="rm-t rm-d" xmlns="http://www.w3.org/2000/svg">
  <title id="rm-t">Remember this</title>
  <desc id="rm-d">Left: a small sketch of accuracy against the square root of KL, a straight rising line followed by a noisy tail with a peak marked. Right: three boxes. Spend KL, not steps. Student error is about the teacher's error shrunk by student size. At the same score, the smaller teacher wins.</desc>
  <line x1="40" y1="250" x2="280" y2="250" class="s-muted" stroke-width="1.5"/>
  <line x1="40" y1="250" x2="40" y2="40" class="s-muted" stroke-width="1.5"/>
  <line x1="40" y1="230" x2="170" y2="100" class="s-paper" stroke-width="4"/>
  <polyline points="170,100 186,92 200,96 214,90 230,102 248,112 268,122" class="s-paper f-none" stroke-width="2.5"/>
  <polygon points="214,72 218,81 228,81 220,87 223,96 214,90 205,96 208,87 200,81 210,81" class="f-predict"/>
  <text x="160" y="280" text-anchor="middle" font-size="17">√KL from start</text>
  <text x="56" y="70" font-size="17" font-weight="600">accuracy</text>
  <rect x="310" y="30" width="350" height="70" rx="10" class="f-paper soft s-paper" stroke-width="1.5"/>
  <text x="485" y="60" text-anchor="middle" font-size="18" font-weight="600">1. Spend KL, not steps</text>
  <text x="485" y="86" text-anchor="middle" font-size="16">gains are linear in √KL, then noisy</text>
  <rect x="310" y="114" width="350" height="70" rx="10" class="f-take soft s-take" stroke-width="1.5"/>
  <text x="485" y="144" text-anchor="middle" font-size="18" font-weight="600">2. Student error ≈ teacher error</text>
  <text x="485" y="170" text-anchor="middle" font-size="16">shrunk by a power of student size</text>
  <rect x="310" y="198" width="350" height="70" rx="10" class="f-predict soft s-predict" stroke-width="1.5"/>
  <text x="485" y="228" text-anchor="middle" font-size="18" font-weight="600">3. Same score? Smaller teacher wins</text>
  <text x="485" y="254" text-anchor="middle" font-size="16">bigger than the student adds nothing</text>
</svg>
